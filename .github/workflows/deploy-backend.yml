name: Deploy Backend to EC2

# 트리거 조건: main 브랜치에 push하면 실행 (현재는 dev, 추후 main으로 변경)
on:
  push:
    branches:
      - ops/cicd
    paths:
      # 백엔드 실행에 영향을 주는 파일만 감시하도록 수정
      - 'src/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle/wrapper/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.github/workflows/deploy-backend.yml'

# 환경 변수
env:
  AWS_REGION: ap-northeast-2
  JAVA_VERSION: '17'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1단계: 코드 다운로드
      - name: Checkout code
        uses: actions/checkout@v4

      # 2단계: Java 17 설치
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'
          cache: 'gradle'

      # 3단계: Gradle 실행 권한 부여
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4단계: JAR 파일 빌드 (테스트 스킵)
      - name: Build with Gradle
        run: ./gradlew clean bootJar -x test

      # 5단계: SSH 키 설정
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      # 6단계: JAR 파일 EC2로 전송
      - name: Copy JAR to EC2
        run: |
          scp -i ~/.ssh/id_rsa build/libs/backend.jar \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/ec2-user/dialogym/backend.jar

      # 7단계: Docker Compose 파일 전송
      - name: Copy docker-compose.yml
        run: |
          scp -i ~/.ssh/id_rsa docker-compose.yml \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/ec2-user/dialogym/
          scp -i ~/.ssh/id_rsa Dockerfile \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/ec2-user/dialogym/

      # 8단계: EC2에서 Docker Compose 재배포
      - name: Deploy on EC2
        run: |
          ssh -i ~/.ssh/id_rsa ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            cd /home/ec2-user/dialogym
          
            # Docker Compose 재시작
            docker-compose down
            docker-compose up -d --build
          
            # 컨테이너 시작 확인
            sleep 10
          
            # 헬스체크
            if docker ps | grep dialogym-backend; then
              echo "Backend container started successfully"
            else
              echo "Failed to start backend container"
              docker-compose logs backend
              exit 1
            fi
          EOF

      # 9단계: 배포 완료 알림
      - name: Deployment completed
        run: |
          echo "================================"
          echo "Backend deployed successfully!"
          echo "API URL: https://api.dialogym.shop"
          echo "================================"